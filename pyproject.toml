[project]
name = "shm-backend"
version = "0.9.3"
description = "结构健康监测（SHM）平台后端"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic 自动生成的迁移脚本不参与 lint/format
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 惯用法：依赖与参数声明放在函数默认值位置
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
