services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: shm-postgres
    environment:
      POSTGRES_USER: shm_user
      POSTGRES_PASSWORD: shm_pass
      POSTGRES_DB: shm_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shm_user -d shm_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shm-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: shm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build: .
    container_name: shm-api
    entrypoint: ["sh", "/app/docker/entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://shm_user:shm_pass@postgres:5432/shm_db
      REDIS_URL: redis://redis:6379/0
      # ADMIN_USERNAME + ADMIN_PASSWORD（可选）：自动创建首个 admin。
      # 生产建议用 Docker Secrets / Vault 注入，不直接写在 compose 文件里。
      # ADMIN_USERNAME:
      # ADMIN_PASSWORD:
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: shm-worker
    command: celery -A app.tasks.celery_app:celery_app worker -Q alerts,analysis,reports,maintenance -c 4
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://shm_user:shm_pass@postgres:5432/shm_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  dtu-server:
    build: .
    container_name: shm-dtu-server
    command: python -m app.dtu_server
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://shm_user:shm_pass@postgres:5432/shm_db
      REDIS_URL: redis://redis:6379/0
    # DTU 监听端口由设备配置决定（Device.config.port）；
    # 生产按需映射，如 5021-5030。开发期不映射（本机直连时除外）。
    ports:
      - "5021-5030:5021-5030"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
